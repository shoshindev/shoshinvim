version: 2
project_name: shoshinvim
before:
  hooks:
    - go mod download
    - go run ./cmd/shoshinvim man bin/man
    - sh scripts/generate-completions.sh
builds:
  - main: ./cmd/shoshinvim
    binary: shoshinvim
    env: [CGO_ENABLED=0]
    # Windows joins the release once it has been tested on a real machine.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -mod=readonly]
    ldflags: ['-s -w -X main.version={{ .Version }}']
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Arch "arm64" }}aarch64{{ else }}x86_64{{ end }}-{{ if eq .Os "darwin" }}apple-darwin{{ else }}unknown-linux-gnu{{ end }}'
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - src: bin/completions/*
        dst: completions
      - src: bin/man/*
        dst: man
checksum:
  name_template: SHA256SUMS
release:
  github:
    owner: shoshindev
    name: shoshinvim
  draft: true
  prerelease: auto
  extra_files:
    - glob: scripts/shoshinvim-installer.sh
changelog:
  sort: asc
