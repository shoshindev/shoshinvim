name: CI
on:
  # Pull requests run through their own event; running on every branch push as well
  # would run the whole matrix twice per update.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.5
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/ ./cmd/shoshinvim
      - name: POSIX installer syntax
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/shoshinvim-installer.sh
          python3 scripts/test-installer.py
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/shoshinvim-installer.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
